set_pump_speed:
  fields:
    config_entry_id: &config_entry_id
      selector:
        config_entry:
          integration: poolcop
    speed:
      required: true
      example: 2
      selector:
        number:
          min: 0
          max: 8
          step: 1
          mode: box

toggle_pump:
  fields:
    config_entry_id: *config_entry_id

toggle_aux:
  fields:
    config_entry_id: *config_entry_id
    aux_id:
      required: true
      example: 1
      selector:
        number:
          min: 1
          max: 15
          step: 1
          mode: box
    module:
      example: "None"
      default: "None"
      selector:
        text:

set_valve_position:
  fields:
    config_entry_id: *config_entry_id
    position:
      required: true
      selector:
        select:
          translation_key: valve_position
          options:
            - filter
            - waste
            - closed
            - backwash
            - bypass
            - rinse

clear_alarm:
  fields:
    config_entry_id: *config_entry_id
    alarm_code:
      example: PressureLowPump1
      selector:
        text:

stop_backwash:
  fields:
    config_entry_id: *config_entry_id

set_filtration_mode:
  fields:
    config_entry_id: *config_entry_id
    mode:
      required: true
      selector:
        select:
          translation_key: filtration_mode
          options: &filtration_modes
            - stop
            - timer
            - eco_plus
            - volume
            - continuous
            - mode_24h

set_filtration_timers:
  fields:
    config_entry_id: *config_entry_id
    mode:
      selector:
        select:
          translation_key: filtration_mode
          options: *filtration_modes
    cycle_1_enabled:
      selector:
        boolean:
    cycle_1_start:
      example: "08:00:00"
      selector:
        time:
    cycle_1_end:
      example: "12:00:00"
      selector:
        time:
    cycle_2_enabled:
      selector:
        boolean:
    cycle_2_start:
      example: "16:00:00"
      selector:
        time:
    cycle_2_end:
      example: "20:00:00"
      selector:
        time:
